# Runpod compute profiles. Verified against the Runpod REST v2 OpenAPI spec
# (https://api.runpod.io/v2/openapi.json) on 2026-09-23. See docs/adr/0010.
#
# Nothing here is a Runpod resource ID: network volumes are discovered (or
# created) by name, pods are discovered by name + a qwenbench label env var.
api:
  base_url: https://api.runpod.io
  request_timeout_s: 30
  # Pods whose name starts with this prefix are considered ours by `qwenbench list`
  # and `qwenbench down --all`.
  pod_name_prefix: qwenbench-

defaults:
  model: qwen3-coder-30b-fp8        # key into config/models.yaml
  cloud: SECURE                     # SECURE | COMMUNITY
  gpu_count: 1
  container_disk_gb: 30
  # HTTPS via Runpod's Cloudflare proxy. Cloudflare caps a connection at ~100s
  # without bytes flowing; we always stream, so first token must arrive <100s.
  endpoint_mode: proxy              # proxy | tcp (public IP + mapped port, no TLS)
  port: 8000
  watchdog_port: 8001
  # Lifecycle guards (all overridable per `qwenbench up` invocation).
  idle_timeout: 30m                 # "off" disables; must be explicit
  startup_timeout: 25m              # first boot downloads ~31 GB of weights
  max_session: 8h                   # hard cap regardless of activity; "off" disables
  max_spend_usd: 10.00              # per session; watchdog terminates when exceeded
  storage:
    mode: network-volume            # network-volume | ephemeral
    size_gb: 60                     # weights ~31 GB + vLLM compile cache + headroom
    mount_path: /workspace

guards:
  max_gpu_count: 1                  # refuse `up` if it would exceed this many live GPUs
  allow_concurrent_profiles: false  # a6000 and l40s both up at once needs --allow-concurrent

profiles:
  a6000:
    description: NVIDIA RTX A6000 48GB (Ampere sm_86) - FP8 weights via Marlin W8A16 kernels
    gpu_type_id: "NVIDIA RTX A6000"
    # Data centers that (as of 2026-09-23) list both A6000 stock and network
    # volume support. `qwenbench doctor` re-checks this live.
    data_center_ids: [CA-MTL-3, EU-RO-1]
    storage:
      volume_name: qwenbench-hf-cache-a6000
    runtime_overrides: {}

  l40s:
    description: NVIDIA L40S 48GB (Ada sm_89) - native FP8
    gpu_type_id: "NVIDIA L40S"
    data_center_ids: [US-IL-1, EU-NL-1, US-TX-3]
    storage:
      volume_name: qwenbench-hf-cache-l40s
    runtime_overrides: {}
