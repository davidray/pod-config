id: cli-customer-filter
title: Add a customer filter across repository and CLI (requires exploration)
category: exploration
source:
  path: ../../fixtures/ledgerlite
setup:
  - uv venv -q .venv --python 3.12
  - uv pip install -q --python .venv/bin/python -r requirements-dev.txt
task:
  role: engineer
  prompt_file: prompt.md
  acceptance_criteria:
    - InvoiceRepository.for_customer(customer_id) returns that customer's invoices in list order
    - "`export` and `list` accept --customer ID and use for_customer"
    - 'Unknown customer id exits with code 2 and prints "unknown customer: <id>" to stderr'
    - list output stays paginated when filtered
agent_validation:
  - .venv/bin/python -m pytest -q
validation:
  overlay: hidden
  commands:
    - .venv/bin/python -m pytest -q
limits:
  timeout: 20m
  max_iterations: 50
